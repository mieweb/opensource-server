# Fetch users' authorized SSH public keys from SSSD (which serves the LDAP
# `sshPublicKey` attribute). %u is replaced by sshd with the login username.
#
# Authorization (owner/collaborator enforcement) is NOT done here: because
# `UsePAM yes` is in effect, sshd runs the PAM `account` phase on every
# successful authentication — publickey included — so a single account hook
# (pam_exec → ssh-access-check, see the Dockerfile) gates both the key and
# password/MFA paths. Keeping key serving as the stock command avoids a
# manager round-trip on every key negotiation.
AuthorizedKeysCommand /usr/bin/sss_ssh_authorizedkeys %u
AuthorizedKeysCommandUser nobody
